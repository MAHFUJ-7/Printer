<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Printers - CampusPrint</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .printers-page {
      min-height: 100vh;
      padding-top: 80px;
      padding-bottom: 3rem;
    }

    .page-header {
      text-align: center;
      margin-bottom: 3rem;
      padding: 0 1rem;
    }

    .page-title {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .page-subtitle {
      color: var(--theme-text-secondary);
      font-size: 1.125rem;
    }

    .search-filter-section {
      margin-bottom: 2rem;
    }

    .search-box {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .search-input {
      width: 100%;
      padding: 1rem 1rem 1rem 3rem;
      border-radius: 16px;
      border: 2px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      color: var(--theme-text);
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--theme-text-secondary);
      pointer-events: none;
    }

    .filter-buttons {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.625rem 1.25rem;
      border-radius: 12px;
      border: 2px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      color: var(--theme-text);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .filter-btn:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .filter-btn.active {
      background: var(--gradient-primary);
      border-color: transparent;
      color: white;
    }

    .printers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .printer-card {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 2px solid var(--glass-border);
      border-radius: 20px;
      padding: 1.5rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .printer-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--gradient-primary);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .printer-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: 0 8px 30px rgba(139, 92, 246, 0.2);
    }

    .printer-card:hover::before {
      opacity: 1;
    }

    .printer-icon {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: var(--gradient-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .printer-icon svg {
      width: 32px;
      height: 32px;
      stroke: white;
    }

    .printer-name {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--theme-text);
    }

    .printer-location {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--theme-text-secondary);
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }

    .printer-location svg {
      width: 16px;
      height: 16px;
    }

    .printer-details {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .detail-label {
      color: var(--theme-text-secondary);
      font-size: 0.875rem;
    }

    .detail-value {
      font-weight: 600;
      color: var(--theme-text);
    }

    .printer-type-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-color {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
    }

    .badge-bw {
      background: rgba(107, 114, 128, 0.1);
      color: #6b7280;
    }

    .badge-both {
      background: rgba(139, 92, 246, 0.1);
      color: var(--primary);
    }

    .price-tag {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
    }

    .request-btn {
      width: 100%;
      padding: 0.875rem;
      border-radius: 12px;
      border: none;
      background: var(--gradient-primary);
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .request-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      color: var(--theme-text-secondary);
    }

    .no-results svg {
      width: 64px;
      height: 64px;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 2px solid var(--glass-border);
      border-radius: 24px;
      padding: 2rem;
      max-width: 500px;
      width: 100%;
      animation: modalSlideUp 0.3s ease;
    }

    @keyframes modalSlideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--theme-text);
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: var(--glass-border);
      color: var(--theme-text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .modal-close:hover {
      background: var(--glass-border);
      transform: rotate(90deg);
    }

    .modal-body {
      color: var(--theme-text-secondary);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .modal-footer {
      display: flex;
      gap: 1rem;
    }

    .modal-btn {
      flex: 1;
      padding: 0.875rem;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .modal-btn-primary {
      background: var(--gradient-primary);
      color: white;
    }

    .modal-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
    }

    .modal-btn-secondary {
      background: var(--glass-border);
      color: var(--theme-text);
    }

    .modal-btn-secondary:hover {
      background: var(--glass-bg);
    }

    @media (max-width: 768px) {
      .page-title {
        font-size: 2rem;
      }

      .printers-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <a href="dashboard.html" class="logo">
        <div class="logo-icon">CP</div>
        <span class="logo-text gradient-text">CampusPrint</span>
      </a>

      <nav class="nav-menu">
        <button class="theme-toggle" title="Toggle theme"></button>
        
        <div style="display: flex; align-items: center; gap: 1rem; padding: 0.5rem 1rem; border-radius: 12px; background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border);">
          <!-- Credits Display -->
          <div style="display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; color: var(--theme-text-secondary);">
            <svg class="credit-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
              <line x1="1" y1="10" x2="23" y2="10"></line>
            </svg>
            <span class="user-credits">৳0.00</span>
          </div>

          <!-- Divider -->
          <div style="width: 1px; height: 20px; background: var(--glass-border);"></div>

          <!-- Username & Profile Button -->
          <button class="profile-button" style="display: flex; align-items: center; gap: 0.6rem; border: none; background: none; cursor: pointer; padding: 0; color: var(--theme-text-primary); font-size: 0.95rem; font-weight: 500;">
            <div class="profile-avatar" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary)); font-size: 0.85rem; font-weight: 600; color: white;">
              <span>U</span>
            </div>
            <span class="user-username" style="font-weight: 600;">User</span>
          </button>
        </div>

          <div class="profile-dropdown hidden">
            <div class="profile-info">
              <p class="profile-name">User Name</p>
              <p class="profile-email">user@example.com</p>
            </div>
            <a href="dashboard.html" class="dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 1v6m0 6v6m5.2-13.2l-4.2 4.2m0 6l4.2 4.2M23 12h-6m-6 0H1m18.2 5.2l-4.2-4.2m0-6l4.2-4.2"></path>
              </svg>
              Dashboard
            </a>
            <button class="dropdown-item danger logout-button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
              Sign Out
            </button>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <!-- Printers Page Content -->
  <div class="printers-page">
    <div class="container">
      <!-- Page Header -->
      <div class="page-header">
        <h1 class="page-title">Find Printers</h1>
        <p class="page-subtitle">Browse available printers across campus</p>
      </div>

      <!-- Search and Filter Section -->
      <div class="search-filter-section">
        <div class="search-box">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input 
            type="text" 
            class="search-input" 
            id="searchInput" 
            placeholder="Search by printer name or location..."
          >
        </div>

        <div class="filter-buttons">
          <button class="filter-btn active" data-filter="all">All Printers</button>
          <button class="filter-btn" data-filter="bw">Black & White</button>
          <button class="filter-btn" data-filter="color">Color</button>
          <button class="filter-btn" data-filter="both">Both</button>
        </div>
      </div>

      <!-- Printers Grid -->
      <div class="printers-grid" id="printersGrid">
        <!-- Printers will be dynamically inserted here -->
      </div>
    </div>
  </div>

  <!-- Print Request Modal -->
  <div class="modal" id="printModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Print Request</h3>
        <button class="modal-close" onclick="closeModal()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <p style="margin-bottom: 0.5rem;"><strong>Printer:</strong> <span id="modalPrinterName"></span></p>
        <p style="margin-bottom: 1.5rem;"><strong>Location:</strong> <span id="modalPrinterLocation"></span></p>

        <form id="printRequestForm">
          <input type="hidden" id="modalPrinterId">

          <div class="form-group">
            <label for="printType" class="form-label">Print Type</label>
            <select id="printType" class="form-input" required onchange="calculateCost()">
              <!-- Options injected dynamically -->
            </select>
          </div>

          <div class="form-group">
            <label for="pdfFile" class="form-label">Upload PDF</label>
            <input type="file" id="pdfFile" accept="application/pdf" class="form-input" required>
          </div>

          <div class="form-group">
            <label for="pageCount" class="form-label">Number of Pages</label>
            <input type="number" id="pageCount" class="form-input" min="1" value="1" required>
          </div>

          <p style="margin-top: 1.5rem; font-size: 1.1rem; font-weight: 600; display: flex; justify-content: space-between;">
            <span>Estimated Cost:</span>
            <span id="estimatedCost" style="color: var(--primary); font-size: 1.5rem;">৳0.00</span>
          </p>
        </form>

        <div id="paymentSection" style="margin-top: 2rem;">
          <h4 style="font-size: 1.2rem; margin-bottom: 1rem;">Payment</h4>
          <p style="color: var(--theme-text-secondary); margin-bottom: 1.5rem;">
            Your current balance: <span class="user-credits">৳0.00</span>
          </p>
          <button class="modal-btn modal-btn-primary" id="payAndPrintBtn">
            Pay & Print
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn modal-btn-secondary" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script src="../js/theme.js"></script>
  <script src="../js/router.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  
  <script>
    // Check authentication
    if (!authManager.requireAuth()) {
      // Will redirect to login if not authenticated
    }

    let printers = [];
    let selectedPrinter = null;
    let currentFilter = 'all';
    let searchQuery = '';

    async function loadPrinters() {
      try {
        const response = await apiClient.listPrinters();
        printers = response.printers || [];
        renderPrinters();
      } catch (error) {
        console.error('Failed to load printers:', error);
      }
    }

    // Render printers
    function renderPrinters() {
      const grid = document.getElementById('printersGrid');
      const filteredPrinters = printers.filter(printer => {
        const printerType = printer.type || 'both';
        const matchesFilter = currentFilter === 'all' || printerType === currentFilter || printerType === 'both';
        const matchesSearch = searchQuery === '' || 
          printer.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          printer.location.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesFilter && matchesSearch;
      });

      if (filteredPrinters.length === 0) {
        grid.innerHTML = `
          <div class="no-results">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            <h3 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--theme-text);">
              No printers found
            </h3>
            <p>Try adjusting your search or filter criteria</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filteredPrinters.map(printer => `
          <div class="printer-card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
              <div class="printer-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="6 9 6 2 18 2 18 9"></polyline>
                  <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                  <rect x="6" y="14" width="12" height="8"></rect>
                </svg>
              </div>
              <div style="display: flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.8rem; border-radius: 20px; background: ${printer.status === 'active' ? 'rgba(34, 197, 94, 0.1)' : 'rgba(239, 68, 68, 0.1)'}; color: ${printer.status === 'active' ? '#22c55e' : '#ef4444'}; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid currentColor;">
                <div style="width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor;"></div>
                ${printer.status === 'active' ? 'Online' : 'Offline'}
              </div>
            </div>
            
            <h3 class="printer-name">${printer.name}</h3>
            
            <div class="printer-location">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
              ${printer.location}
            </div>

            <div class="printer-details">
              <div class="detail-row">
                <span class="detail-label">Location</span>
                <span class="detail-value">${printer.location}</span>
              </div>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 0.5rem;">
                <div style="padding: 0.75rem; background: rgba(0,0,0,0.03); border-radius: 12px; border: 1px solid var(--glass-border);">
                  <span style="font-size: 0.7rem; color: var(--theme-text-secondary); display: block; text-transform: uppercase; font-weight: 700;">B&W</span>
                  <span style="font-weight: 700; color: var(--theme-text-primary);">৳${Number(printer.pricePerPage || 0).toFixed(2)}</span>
                </div>
                ${printer.priceColor ? `
                <div style="padding: 0.75rem; background: rgba(139, 92, 246, 0.05); border-radius: 12px; border: 1px solid rgba(139, 92, 246, 0.2);">
                  <span style="font-size: 0.7rem; color: var(--primary); display: block; text-transform: uppercase; font-weight: 700;">Color</span>
                  <span style="font-weight: 700; color: var(--primary);">৳${Number(printer.priceColor).toFixed(2)}</span>
                </div>
                ` : `
                <div style="padding: 0.75rem; background: rgba(0,0,0,0.02); border-radius: 12px; border: 1px solid var(--glass-border); opacity: 0.5;">
                  <span style="font-size: 0.7rem; color: var(--theme-text-secondary); display: block; text-transform: uppercase; font-weight: 700;">Color</span>
                  <span style="font-weight: 500; font-size: 0.85rem;">N/A</span>
                </div>
                `}
              </div>
            </div>

            <button class="request-btn" onclick="openPrintModal('${printer.id}')" style="margin-top: 1rem;">
              Request Print
            </button>
          </div>
        `).join('');
    }

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.dataset.filter;
        renderPrinters();
      });
    });

    // Search functionality
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', function() {
      searchQuery = this.value;
      renderPrinters();
    });

    function calculateCost() {
      if (!selectedPrinter) return;
      const pageCount = parseInt(document.getElementById('pageCount').value);
      const printType = document.getElementById('printType').value;
      
      if (isNaN(pageCount) || pageCount <= 0) {
        document.getElementById('estimatedCost').textContent = '৳0.00';
        return;
      }

      const price = printType === 'color' ? selectedPrinter.priceColor : selectedPrinter.pricePerPage;
      const cost = pageCount * price;
      document.getElementById('estimatedCost').textContent = `৳${cost.toFixed(2)}`;
    }

    // Modal functions
    function openPrintModal(printerId) {
      selectedPrinter = printers.find(p => String(p.id) === String(printerId));
      if (!selectedPrinter) return;

      document.getElementById('modalPrinterId').value = selectedPrinter.id;
      document.getElementById('modalPrinterName').textContent = selectedPrinter.name;
      document.getElementById('modalPrinterLocation').textContent = selectedPrinter.location;
      
      // Setup Print Type options
      const printTypeSelect = document.getElementById('printType');
      printTypeSelect.innerHTML = '<option value="bw">Black & White (৳' + Number(selectedPrinter.pricePerPage).toFixed(2) + ')</option>';
      if (selectedPrinter.priceColor) {
        printTypeSelect.innerHTML += '<option value="color">Full Color (৳' + Number(selectedPrinter.priceColor).toFixed(2) + ')</option>';
      }

      document.getElementById('pageCount').value = 1; 
      document.getElementById('pdfFile').value = ''; 
      calculateCost();
      authManager.updateUI(); 

      document.getElementById('printModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('printModal').classList.remove('show');
      selectedPrinter = null;
    }

    // Close modal on outside click
    document.getElementById('printModal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeModal();
      }
    });

    // Close modal on escape key
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeModal();
      }
    });

    document.getElementById('pageCount').addEventListener('input', calculateCost);
    document.getElementById('pdfFile').addEventListener('change', function() {
      // Simulate page count for PDF. In a real app, you'd use a library like pdf.js to get actual page count.
      const file = this.files[0];
      if (file) {
        const simulatedPages = Math.floor(Math.random() * 20) + 5; // Simulate 5-25 pages
        document.getElementById('pageCount').value = simulatedPages;
      } else {
        document.getElementById('pageCount').value = 1;
      }
      calculateCost();
    });

    document.getElementById('payAndPrintBtn').addEventListener('click', async function() {
      const printerId = document.getElementById('modalPrinterId').value;
      const pdfFile = document.getElementById('pdfFile').files[0];
      const pageCount = parseInt(document.getElementById('pageCount').value);
      const estimatedCost = parseFloat(document.getElementById('estimatedCost').textContent.replace('৳', ''));

      if (!pdfFile) {
        app.showError('Please upload a PDF file.');
        return;
      }
      if (isNaN(pageCount) || pageCount <= 0) {
        app.showError('Please enter a valid number of pages.');
        return;
      }
      if (authManager.user.credits < estimatedCost) {
        app.showError('Insufficient credits. Please top up your account.');
        return;
      }

      // Simulate payment success and submit print job
      try {
        await apiClient.submitPrintJob({
          printerId: printerId,
          fileName: pdfFile.name,
          pages: pageCount,
          printType: document.getElementById('printType').value
        });
        
        // Deduct credits locally for immediate UI update (backend will also do this)
        authManager.updateCredits(-estimatedCost);

        app.showSuccess('Print job submitted successfully! Check Orders page for status.');
        closeModal();
      } catch (error) {
        console.error('Failed to submit print job:', error);
        app.showError(error.message || 'Failed to submit print job.');
      }
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadPrinters();
      authManager.updateUI();
    });
  </script>
</body>
</html>
