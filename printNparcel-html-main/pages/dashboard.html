<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - CampusPrint</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <a href="dashboard.html" class="logo">
        <div class="logo-icon">CP</div>
        <span class="logo-text gradient-text">CampusPrint</span>
      </a>

      <nav class="nav-menu">
        <div style="display: flex; align-items: center; gap: 1.5rem;">
          <button class="theme-toggle" title="Toggle theme"></button>
          
          <div style="display: flex; align-items: center; gap: 1rem; padding: 0.5rem 1rem; border-radius: 12px; background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border);">
            <!-- Credits Display -->
            <div style="display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; color: var(--theme-text-secondary);">
              <svg class="credit-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                <line x1="1" y1="10" x2="23" y2="10"></line>
              </svg>
              <span class="user-credits">৳0.00</span>
            </div>

            <!-- Divider -->
            <div style="width: 1px; height: 20px; background: var(--glass-border);"></div>

            <!-- Username & Profile Button -->
            <button class="profile-button" style="display: flex; align-items: center; gap: 0.6rem; border: none; background: none; cursor: pointer; padding: 0; color: var(--theme-text-primary); font-size: 0.95rem; font-weight: 500;">
              <div class="profile-avatar" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary)); font-size: 0.85rem; font-weight: 600; color: white;">
                <span>U</span>
              </div>
              <span class="user-username" style="font-weight: 600;">User</span>
            </button>
          </div>

          <div class="profile-dropdown hidden">
            <div class="profile-info">
              <p class="profile-name">User Name</p>
              <p class="profile-email">user@example.com</p>
            </div>
            <div class="custom-dropdown-items" style="padding: 0.75rem 0;">
              <!-- Dynamic items injected by authManager -->
            </div>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <!-- Dashboard Content -->
  <div class="dashboard">
    <div class="dashboard-header">
      <h1 class="dashboard-title">Welcome Back, <span class="user-username">User</span>!</h1>
      <p class="dashboard-subtitle">Here's what's happening with your account today</p>
    </div>

    <div class="dashboard-content container">
      <!-- Quick Stats -->
      <div class="stats-grid">
        <div class="glass-card stat-card">
          <div class="stat-value" id="totalOrders">0</div>
          <div class="stat-label">Total Orders</div>
        </div>
        
        <div class="glass-card stat-card">
          <div class="stat-value" id="activeOrders">0</div>
          <div class="stat-label">Active Orders</div>
        </div>
        
        <div class="glass-card stat-card">
          <div class="stat-value" id="totalSpent">৳0.00</div>
          <div class="stat-label">Total Spent</div>
        </div>
        
        <div class="glass-card stat-card">
          <div class="stat-value" id="savedMoney">৳0.00</div>
          <div class="stat-label">Saved Money</div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="glass-card" style="padding: 2rem; margin-bottom: 2rem;">
        <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem;">Quick Actions</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
          <button class="glass-button primary" onclick="router.navigate('/pages/printers.html')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 0.5rem;">
              <polyline points="6 9 6 2 18 2 18 9"></polyline>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
              <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
            Find Printers
          </button>
          
          <button class="glass-button secondary" onclick="router.navigate('/pages/orders.html')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 0.5rem;">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            View Orders
          </button>
          
          <button class="glass-button secondary" id="addPrinterBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 0.5rem;">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Add Printer
          </button>
        </div>
      </div>

      <!-- Recent Activity -->
      <div class="glass-card" style="padding: 2rem;">
        <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem;">Recent Activity</h2>
        <div id="activityList">
          <p style="text-align: center; color: var(--theme-text-secondary); padding: 2rem;">
            No recent activity to display
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/theme.js"></script>
  <script src="../js/router.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  
  <script>
    // Check authentication
    if (!authManager.requireAuth()) {
      // Will redirect to login if not authenticated
    }

    function formatAgo(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diffMs = now - date;
      const diffMin = Math.floor(diffMs / 60000);
      if (diffMin < 60) return `${Math.max(diffMin, 1)} min ago`;
      const diffHours = Math.floor(diffMin / 60);
      if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
      const diffDays = Math.floor(diffHours / 24);
      return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;
    }

    // Load dashboard data from backend
    async function loadDashboardData() {
      try {
        const jobsResponse = await apiClient.listPrintJobs();
        const jobs = jobsResponse.printJobs || [];

        const totalOrders = jobs.length;
        const activeOrders = jobs.filter(job => ['pending', 'processing', 'in_progress'].includes(job.status)).length;
        const totalSpent = jobs.reduce((sum, job) => sum + Number(job.cost || 0), 0);
        const savedMoney = totalSpent * 0.15;

        document.getElementById('totalOrders').textContent = totalOrders;
        document.getElementById('activeOrders').textContent = activeOrders;
        document.getElementById('totalSpent').textContent = `৳${totalSpent.toFixed(2)}`;
        document.getElementById('savedMoney').textContent = `৳${savedMoney.toFixed(2)}`;

        const activityList = document.getElementById('activityList');
        if (jobs.length === 0) {
          activityList.innerHTML = `
            <p style="text-align: center; color: var(--theme-text-secondary); padding: 2rem;">
              No recent activity to display
            </p>
          `;
          return;
        }

        activityList.innerHTML = jobs.slice(0, 8).map(job => `
          <div style="padding: 1rem; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center;">
            <div>
              <p style="font-weight: 500; margin-bottom: 0.25rem;">${job.fileName} (${job.pages} pages)</p>
              <p style="font-size: 0.875rem; color: var(--theme-text-secondary);">${formatAgo(job.createdAt)}</p>
            </div>
            <span style="padding: 0.25rem 0.75rem; border-radius: 8px; font-size: 0.75rem; font-weight: 500;
                         background: ${job.status === 'completed' ? 'rgba(16, 185, 129, 0.1)' : 'rgba(251, 191, 36, 0.1)'};
                         color: ${job.status === 'completed' ? 'var(--success)' : 'var(--warning)'};">
              ${job.status}
            </span>
          </div>
        `).join('');
      } catch (error) {
        console.error('Failed to load dashboard data:', error);
      }
    }

    // Initialize dashboard
    document.addEventListener('DOMContentLoaded', () => {
      loadDashboardData();
      authManager.updateUI();

      // Handle Add Printer button logic
      const addPrinterBtn = document.getElementById('addPrinterBtn');
      if (addPrinterBtn) {
        addPrinterBtn.addEventListener('click', () => {
          if (authManager.hasRole('printer_owner')) {
            router.navigate('/pages/printer-register.html');
          } else {
            if (confirm('You need to be a Printer Owner to add a printer. Would you like to upgrade your profile now?')) {
              apiClient.upgradeToPrinterOwner().then(updatedUser => {
                authManager.user = { ...authManager.user, ...updatedUser };
                authManager.saveUser();
                authManager.updateUI();
                router.navigate('/pages/printer-register.html');
              }).catch(err => {
                alert('Upgrade failed: ' + err.message);
              });
            }
          }
        });
      }
    });
  </script>
</body>
</html>
