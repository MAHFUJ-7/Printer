<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - CampusPrint</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .orders-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 6rem 1rem 2rem;
    }

    .orders-header {
      margin-bottom: 2rem;
    }

    .orders-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .orders-subtitle {
      color: var(--theme-text-secondary);
      font-size: 1rem;
    }

    .tab-filters {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .tab-button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      color: var(--theme-text-primary);
    }

    .tab-button:hover {
      background: var(--glass-hover);
      transform: translateY(-2px);
    }

    .tab-button.active {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    .orders-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .order-card {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.5rem;
      transition: all 0.3s ease;
    }

    .order-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      border-color: var(--primary);
    }

    .order-card-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .order-id {
      font-size: 0.875rem;
      color: var(--theme-text-secondary);
      font-weight: 500;
    }

    .order-id span {
      color: var(--primary);
      font-weight: 700;
    }

    .status-badge {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-pending {
      background: rgba(251, 191, 36, 0.1);
      color: #f59e0b;
    }

    .status-processing {
      background: rgba(59, 130, 246, 0.1);
      color: #3b82f6;
    }

    .status-completed {
      background: rgba(16, 185, 129, 0.1);
      color: #10b981;
    }

    .status-cancelled {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
    }

    .order-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .order-detail-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .order-detail-item svg {
      color: var(--primary);
      flex-shrink: 0;
    }

    .order-detail-label {
      font-size: 0.875rem;
      color: var(--theme-text-secondary);
    }

    .order-detail-value {
      font-weight: 600;
      color: var(--theme-text-primary);
    }

    .order-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid var(--glass-border);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .order-cost {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
    }

    .view-details-btn {
      padding: 0.625rem 1.5rem;
      border: none;
      border-radius: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      font-size: 0.875rem;
    }

    .view-details-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
    }

    .empty-state svg {
      width: 80px;
      height: 80px;
      color: var(--theme-text-secondary);
      opacity: 0.5;
      margin-bottom: 1.5rem;
    }

    .empty-state h3 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--theme-text-primary);
    }

    .empty-state p {
      color: var(--theme-text-secondary);
      margin-bottom: 2rem;
    }

    @media (max-width: 768px) {
      .orders-title {
        font-size: 1.5rem;
      }

      .order-details {
        grid-template-columns: 1fr;
      }

      .order-card-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .order-card-footer {
        flex-direction: column;
        align-items: flex-start;
      }

      .view-details-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <a href="dashboard.html" class="logo">
        <div class="logo-icon">CP</div>
        <span class="logo-text gradient-text">CampusPrint</span>
      </a>

      <nav class="nav-menu">
        <div style="display: flex; align-items: center; gap: 1.5rem;">
          <button class="theme-toggle" title="Toggle theme"></button>
          
          <div style="display: flex; align-items: center; gap: 1rem; padding: 0.5rem 1rem; border-radius: 12px; background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border);">
            <!-- Credits Display -->
            <div style="display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; color: var(--theme-text-secondary);">
              <svg class="credit-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                <line x1="1" y1="10" x2="23" y2="10"></line>
              </svg>
              <span class="user-credits">৳0.00</span>
            </div>

            <!-- Divider -->
            <div style="width: 1px; height: 20px; background: var(--glass-border);"></div>

            <!-- Username & Profile Button -->
            <button class="profile-button" style="display: flex; align-items: center; gap: 0.6rem; border: none; background: none; cursor: pointer; padding: 0; color: var(--theme-text-primary); font-size: 0.95rem; font-weight: 500;">
              <div class="profile-avatar" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary)); font-size: 0.85rem; font-weight: 600; color: white;">
                <span>U</span>
              </div>
              <span class="user-username" style="font-weight: 600;">User</span>
            </button>
          </div>

          <div class="profile-dropdown hidden">
            <div class="profile-info">
              <p class="profile-name">User Name</p>
              <p class="profile-email">user@example.com</p>
            </div>
            <a href="dashboard.html" class="dropdown-item">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 1v6m0 6v6m5.2-13.2l-4.2 4.2m0 6l4.2 4.2M23 12h-6m-6 0H1m18.2 5.2l-4.2-4.2m0-6l4.2-4.2"></path>
              </svg>
              Dashboard
            </a>
            <button class="dropdown-item danger logout-button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
              Sign Out
            </button>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <!-- Orders Content -->
  <div class="orders-container">
    <div class="orders-header">
      <h1 class="orders-title">My Orders</h1>
      <p class="orders-subtitle">Track and manage all your print orders</p>
    </div>

    <!-- Tab Filters -->
    <div class="tab-filters">
      <button class="tab-button active" data-status="all">All Orders</button>
      <button class="tab-button" data-status="pending">Pending</button>
      <button class="tab-button" data-status="processing">Processing</button>
      <button class="tab-button" data-status="completed">Completed</button>
      <button class="tab-button" data-status="cancelled">Cancelled</button>
    </div>

    <!-- Orders List -->
    <div class="orders-list" id="ordersList">
      <!-- Orders will be dynamically inserted here -->
    </div>

    <!-- Empty State -->
    <div class="empty-state hidden" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
      </svg>
      <h3>No Orders Found</h3>
      <p>You don't have any orders yet. Start by finding a printer near you!</p>
      <button class="glass-button primary" onclick="router.navigate('/pages/printers.html')">
        Find Printers
      </button>
    </div>
  </div>

  <script src="../js/theme.js"></script>
  <script src="../js/router.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  
  <script>
    // Check authentication
    if (!authManager.requireAuth()) {
      // Will redirect to login if not authenticated
    }

    let orders = [];

    let currentFilter = 'all';

    // Format date to relative time
    function formatDate(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diffTime = Math.abs(now - date);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      
      if (diffDays === 0) return 'Today';
      if (diffDays === 1) return 'Yesterday';
      if (diffDays < 7) return `${diffDays} days ago`;
      
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // Create order card HTML
    function createOrderCard(order) {
      const statusClass = `status-${order.status}`;
      const statusText = order.status.charAt(0).toUpperCase() + order.status.slice(1);
      
      return `
        <div class="order-card" data-status="${order.status}">
          <div class="order-card-header">
            <div class="order-id">Order ID: <span>${order.id}</span></div>
            <span class="status-badge ${statusClass}">${statusText}</span>
          </div>
          
          <div class="order-details">
            <div class="order-detail-item">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                <rect x="6" y="14" width="12" height="8"></rect>
              </svg>
              <div>
                <div class="order-detail-label">Printer</div>
                <div class="order-detail-value">${order.printerName}</div>
              </div>
            </div>
            
            <div class="order-detail-item">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              <div>
                <div class="order-detail-label">Date & Time</div>
                <div class="order-detail-value">${formatDate(order.date)} • ${order.time}</div>
              </div>
            </div>
            
            <div class="order-detail-item">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
              </svg>
              <div>
                <div class="order-detail-label">Pages</div>
                <div class="order-detail-value">${order.pages} pages</div>
              </div>
            </div>
          </div>
          
          <div class="order-card-footer">
            <div class="order-cost">৳${order.cost.toFixed(2)}</div>
            <button class="view-details-btn" onclick="viewOrderDetails('${order.id}')">
              View Details
            </button>
          </div>
        </div>
      `;
    }

    // Filter orders
    function filterOrders(status) {
      currentFilter = status;
      const ordersList = document.getElementById('ordersList');
      const emptyState = document.getElementById('emptyState');
      
      let filteredOrders = orders;
      if (status !== 'all') {
        filteredOrders = orders.filter(order => order.status === status);
      }
      
      if (filteredOrders.length === 0) {
        ordersList.innerHTML = '';
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        ordersList.innerHTML = filteredOrders.map(order => createOrderCard(order)).join('');
      }
    }

    // View order details
    function viewOrderDetails(orderId) {
      // In a real app, this would navigate to order details page
      alert(`Viewing details for ${orderId}\n\nThis would navigate to the order details page.`);
      // router.navigate(`/pages/order-details.html?id=${orderId}`);
    }

    // Setup tab filters
    function setupTabFilters() {
      const tabButtons = document.querySelectorAll('.tab-button');
      
      tabButtons.forEach(button => {
        button.addEventListener('click', () => {
          // Remove active class from all buttons
          tabButtons.forEach(btn => btn.classList.remove('active'));
          
          // Add active class to clicked button
          button.classList.add('active');
          
          // Filter orders
          const status = button.getAttribute('data-status');
          filterOrders(status);
        });
      });
    }

    async function loadOrders() {
      try {
        const response = await apiClient.listPrintJobs();
        const jobs = response.printJobs || [];
        orders = jobs.map(job => ({
          id: `ORD-${String(job.id).padStart(5, '0')}`,
          printerName: `Printer #${job.printerId}`,
          date: job.createdAt,
          time: new Date(job.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          pages: Number(job.pages || 0),
          cost: Number(job.cost || 0),
          status: job.status === 'in_progress' ? 'processing' : job.status,
          documentName: job.fileName,
        }));
      } catch (error) {
        console.error('Failed to load orders:', error);
      }
    }

    // Initialize orders page
    document.addEventListener('DOMContentLoaded', () => {
      authManager.updateUI();
      setupTabFilters();
      loadOrders().then(() => filterOrders('all'));
    });
  </script>
</body>
</html>
