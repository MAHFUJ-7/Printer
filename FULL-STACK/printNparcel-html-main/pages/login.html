<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CampusPrint</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <a href="../index.html" class="logo">
        <div class="logo-icon">CP</div>
        <span class="logo-text gradient-text">CampusPrint</span>
      </a>
      <nav class="nav-menu">
        <button class="theme-toggle" title="Toggle theme"></button>
      </nav>
    </div>
  </header>

  <!-- Login Form -->
  <div class="form-container">
    <div class="form-wrapper">
      <div class="form-header">
        <h2 class="form-title gradient-text">Welcome Back</h2>
        <p class="form-subtitle">Sign in to your account or explore in demo mode</p>
      </div>

      <div class="glass-card form">
        <form id="loginForm" onsubmit="handleLogin(event)">
          <!-- Error Message -->
          <div id="errorMessage" class="error-message" style="display: none;"></div>

          <!-- Email Input -->
          <div class="input-group has-label">
            <label for="email">Email</label>
            <div style="position: relative;">
              <div class="icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
              </div>
              <input 
                type="email" 
                id="email" 
                class="glass-input" 
                placeholder="your@email.com"
                required
                autocomplete="username"
              >
            </div>
          </div>

          <!-- Password Input -->
          <div class="input-group has-label">
            <label for="password">Password</label>
            <div style="position: relative;">
              <div class="icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </div>
              <input 
                type="password" 
                id="password" 
                class="glass-input" 
                placeholder="••••••••"
                required
                autocomplete="current-password"
              >
              <button type="button" class="password-toggle" onclick="togglePassword()">
                <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Role Selection -->
          <div class="input-group has-label">
            <label for="role">Login As</label>
            <div style="position: relative;">
              <div class="icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
              </div>
              <select 
                id="role" 
                class="glass-input" 
                required
                style="appearance: none; -webkit-appearance: none; cursor: pointer;"
              >
                <option value="user" selected>Student</option>
                <option value="printer_owner">Print-owner</option>
                <option value="admin">Admin</option>
              </select>
              <div class="password-toggle" style="pointer-events: none; right: 1rem;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </div>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="glass-button primary glow w-full" id="submitBtn">
            Sign In
          </button>
        </form>

        <!-- Footer -->
        <div class="form-footer">
          <p>
            Don't have an account?
            <a href="signup.html">Sign up</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/theme.js"></script>
  <script src="../js/router.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  
  <script>
    let passwordVisible = false;

    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      
      passwordVisible = !passwordVisible;
      passwordInput.type = passwordVisible ? 'text' : 'password';
      
      if (passwordVisible) {
        eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      } else {
        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    }

    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
    }

    function hideError() {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.style.display = 'none';
    }

    function setLoading(loading) {
      const submitBtn = document.getElementById('submitBtn');
      const form = document.getElementById('loginForm');
      
      if (loading) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span>Signing in...';
        form.querySelectorAll('input, select').forEach(input => input.disabled = true);
      } else {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Sign In';
        form.querySelectorAll('input, select').forEach(input => input.disabled = false);
      }
    }

    function normalizeRedirectPath(path) {
      if (!path) return null;
      if (path.startsWith('/pages/')) {
        return path.substring(path.lastIndexOf('/') + 1);
      }
      return path;
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideError();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;

      if (!email || !password) {
        showError('Please enter both email and password');
        return;
      }

      setLoading(true);

      try {
        await authManager.login(email, password, role);
        
        // Check for redirect
        const redirect = normalizeRedirectPath(sessionStorage.getItem('redirectAfterLogin'));
        sessionStorage.removeItem('redirectAfterLogin');
        
        if (redirect) {
          window.location.href = redirect;
        } else {
          window.location.href = authManager.getRoleBasedRedirectUrl();
        }
      } catch (err) {
        setLoading(false);
        showError(err.message || 'Invalid email or password');
      }
    }

    // Clear error on input
    document.getElementById('email').addEventListener('input', hideError);
    document.getElementById('password').addEventListener('input', hideError);
    document.getElementById('role').addEventListener('change', hideError);
  </script>
</body>
</html>
