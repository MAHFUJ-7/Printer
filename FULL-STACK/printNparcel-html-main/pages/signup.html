<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - CampusPrint</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <a href="../index.html" class="logo">
        <div class="logo-icon">CP</div>
        <span class="logo-text gradient-text">CampusPrint</span>
      </a>
      <nav class="nav-menu">
        <button class="theme-toggle" title="Toggle theme"></button>
      </nav>
    </div>
  </header>

  <!-- Signup Form -->
  <div class="form-container">
    <div class="form-wrapper">
      <div class="form-header">
        <h2 class="form-title gradient-text">Join CampusPrint</h2>
        <p class="form-subtitle">Create your account to get started</p>
      </div>

      <div class="glass-card form">
        <form id="signupForm">
          <!-- Error Message -->
          <div id="errorMessage" class="error-message" style="display: none;"></div>

          <!-- Name Grid -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
            <div class="input-group has-label">
              <label for="firstName">First Name</label>
              <div style="position: relative;">
                <div class="icon">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                </div>
                <input type="text" id="firstName" name="firstName" class="glass-input" placeholder="John" required>
              </div>
            </div>

            <div class="input-group has-label">
              <label for="lastName">Last Name</label>
              <div style="position: relative;">
                <div class="icon">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                </div>
                <input type="text" id="lastName" name="lastName" class="glass-input" placeholder="Doe" required>
              </div>
            </div>
          </div>

          <!-- Username and Email -->
          <div class="input-group has-label">
            <label for="username">Username</label>
            <div style="position: relative;">
              <div class="icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </div>
              <input type="text" id="username" name="username" class="glass-input" placeholder="johndoe" required>
            </div>
          </div>

          <div class="input-group has-label">
            <label for="email">Email Address</label>
            <div style="position: relative;">
              <div class="icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
              </div>
              <input type="email" id="email" name="email" class="glass-input" placeholder="your@email.com" required>
            </div>
          </div>

          <!-- University Info -->
          <div class="input-group has-label">
            <label for="university">University</label>
            <div style="position: relative;">
              <div class="icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                  <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
              </div>
              <input type="text" id="university" name="university" class="glass-input" placeholder="University Name" required>
            </div>
          </div>

          <!-- Role Selection -->
          <div class="input-group has-label">
            <label for="role">Account Type</label>
            <div style="position: relative;">
              <div class="icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                  <circle cx="9" cy="7" r="4"></circle>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
              </div>
              <select id="role" name="role" class="glass-input" required style="appearance: none; cursor: pointer;">
                <option value="user" selected>Student </option>
                <option value="printer_owner">Print-owner</option>
              </select>
              <div style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--theme-text-muted);">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </div>
            </div>
          </div>

          <!-- Password Grid -->
          <div class="input-group has-label">
            <label for="password">Password</label>
            <div style="position: relative;">
              <div class="icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </div>
              <input type="password" id="password" name="password" class="glass-input" placeholder="••••••••" required>
              <button type="button" class="password-toggle" onclick="togglePassword('password', 'eyeIcon1')">
                <svg id="eyeIcon1" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="input-group has-label">
            <label for="confirmPassword">Confirm Password</label>
            <div style="position: relative;">
              <div class="icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </div>
              <input type="password" id="confirmPassword" name="confirmPassword" class="glass-input" placeholder="••••••••" required>
              <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', 'eyeIcon2')">
                <svg id="eyeIcon2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="glass-button primary glow w-full" id="submitBtn">
            Create Account
          </button>
        </form>

        <!-- Footer -->
        <div class="form-footer">
          <p>
            Already have an account?
            <a href="login.html">Sign in</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/theme.js"></script>
  <script src="../js/router.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  
  <script>
    const passwordStates = {
      password: false,
      confirmPassword: false
    };

    function togglePassword(fieldId, iconId) {
      const passwordInput = document.getElementById(fieldId);
      const eyeIcon = document.getElementById(iconId);
      
      passwordStates[fieldId] = !passwordStates[fieldId];
      passwordInput.type = passwordStates[fieldId] ? 'text' : 'password';
      
      if (passwordStates[fieldId]) {
        eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      } else {
        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    }

    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
    }

    function hideError() {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.style.display = 'none';
    }

    function setLoading(loading) {
      const submitBtn = document.getElementById('submitBtn');
      const form = document.getElementById('signupForm');
      
      if (loading) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span>Creating account...';
        form.querySelectorAll('input, select, button').forEach(el => el.disabled = true);
        // Don't disable the toggle buttons
        form.querySelectorAll('.password-toggle').forEach(el => el.disabled = false);
      } else {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Create Account';
        form.querySelectorAll('input, select, button').forEach(el => el.disabled = false);
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      hideError();
      
      const formData = {
        firstName: document.getElementById('firstName').value.trim(),
        lastName: document.getElementById('lastName').value.trim(),
        username: document.getElementById('username').value.trim(),
        email: document.getElementById('email').value.trim(),
        university: document.getElementById('university').value.trim(),
        role: document.getElementById('role').value,
        password: document.getElementById('password').value,
        confirmPassword: document.getElementById('confirmPassword').value
      };

      // Validation
      if (!formData.firstName || !formData.lastName || !formData.username || 
          !formData.email || !formData.university || !formData.role || !formData.password) {
        showError('Please fill in all required fields');
        return;
      }

      if (formData.password !== formData.confirmPassword) {
        showError('Passwords do not match');
        return;
      }

      if (formData.password.length < 6) {
        showError('Password must be at least 6 characters');
        return;
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(formData.email)) {
        showError('Please enter a valid email address');
        return;
      }

      const usernameRegex = /^[a-zA-Z0-9_.-]{3,24}$/;
      if (!usernameRegex.test(formData.username)) {
        showError('Username must be 3-24 characters');
        return;
      }

      setLoading(true);

      try {
        await window.authManager.signup(formData);
        window.location.href = window.authManager.getRoleBasedRedirectUrl();
      } catch (err) {
        setLoading(false);
        showError(err.message || 'Failed to create account. Please try again.');
      }
    }

    // Clear error on input
    document.querySelectorAll('#signupForm input, #signupForm select').forEach(el => {
      el.addEventListener('input', hideError);
    });

    document.getElementById('signupForm').addEventListener('submit', handleSignup);
  </script>
</body>
</html>
